<!DOCTYPE html>
<html lang="en">
<head>
       <style>
            body
            {
                background-color: rgb(89, 53, 122);/*Changes the whole page*/
            }
        </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="product-card">
        <h1 class="product-title">Willy Wonka Chocolate Bar</h1>
        <p class="product-description"> zzzzzzz </p>
        <button id="theme-toggle" aria-label="Toggle dark mode">
        Switch Theme
    </button>
        <details>
  <summary>Click to reveal more details</summary>
  <p>This is a delicious chocolate bar made by Willy Wonka. It is rich, creamy, and perfect for satisfying your sweet tooth.
    It comes in a variety of flavors and is loved by chocolate enthusiasts of all ages.</p>
</details>
        <p class="product-price">$8.99</p>
        <button class="buy-button">Buy Now</button>
    </div>
</body>
</html>
