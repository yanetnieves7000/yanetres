<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .shadow-card {
            width: 300px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            
            /* Syntax: horizontal vertical blur spread color */
            box-shadow: 0px 4px 10px 2px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>

    <div class="shadow-card">
        <h3>Card Title</h3>
        <p>This box has a beautiful shadow!</p>
    </div>

</body>
</html>
