
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculus Quiz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #c69ee0;
            text-align: center;
            padding: 40px;
        }

        .quiz-container {
            background: rgb(80, 29, 121);
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 50px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #9ce2ee;
        }

        #question {
            font-size: 22px;
            margin: 25px 0;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            background-color: #a7ede9;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #64cccc;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        #feedback {
            font-weight: bold;
            margin: 20px;
        }

        #next-btn {
            background-color: #16a34a;
            display: none;
        }

        #restart-btn {
            background-color: #f59e0b;
            display: none;
        }
    </style>
</head>

<body>

    <div class="quiz-container">

        <h1>Calculus Quiz</h1>

        <p id="score">Score: 0</p>

        <p id="question">Question goes here</p>

        <div id="answers"></div>

        <p id="feedback"></p>

        <button id="next-btn" onclick="nextQuestion()">
            Next Question🥸
        </button>

        <button id="restart-btn" onclick="restartQuiz()">
            Play Again?🤔
        </button>

    </div>

    <script>

        const questions = [
            {
                question: "The frac function is defined by:frac(x) = x - floor(x)",
                answers: ["Differentiable and continuous for all Real numbers", "Differentiable for all Real numbers, but not always continuous", "Continuous, but not differentiable", "Sometimes differentiable, but not continuous"],
                correct: "Sometimes differentiable, but not continuous"
            },

            {
                question: "If f(x) = (x2 + 1)(x2 − 1), what is f ''(x) ?(f ''(x) is the second derivative of f(x))",
                answers: ["4", "12x2 − 4", "12x2", "12x2 + 4"],
                correct: "12x2"
            },

            {
                question: "Use differentiation from first principles to find the slope of the function y = x3 at x = -2",
                answers: ["-12", "-8", "8", "12"],
                correct: "12"
            },

            {
                question: "Which one of the following is a not a continuous function?",
                answers: ["f(x) = ceil(x + 1)", "f(x) = (x + 1)3", "f(x) = e(x + 1)", "f(x) = |x + 1|"],
                correct: "f(x) = ceil(x + 1)"
            },

            {
                question: "What is the y coordinate of the maximum point for the curve y = -9x2 − 3x + 2?",
                answers: ["1 3/4", "2", "2 1/4", "2 1/2"],
                correct: "2 1/4"
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function showQuestion() {

            const q = questions[currentQuestion];

            document.getElementById("question").textContent =
                q.question;

            document.getElementById("score").textContent =
                "Score: " + score;

            document.getElementById("feedback").textContent = "";

            document.getElementById("next-btn").style.display = "none";

            const answersDiv = document.getElementById("answers");
            answersDiv.innerHTML = "";

            q.answers.forEach(answer => {

                const button = document.createElement("button");

                button.textContent = answer;

                button.onclick = () => checkAnswer(answer, button);

                answersDiv.appendChild(button);

            });
        }

        function checkAnswer(answer, button) {

            const correct = questions[currentQuestion].correct;

            const buttons = document.querySelectorAll("#answers button");

            buttons.forEach(btn => btn.disabled = true);

            if (answer === correct) {

                score++;

                document.getElementById("feedback").textContent =
                    "Correct‼️🙊";

                button.style.backgroundColor = "#16a34a";

            } else {

                document.getElementById("feedback").textContent =
                    "WRONG‼️😿The correct answer is " + correct + ".";

                button.style.backgroundColor = "#dc2626";

            }

            document.getElementById("score").textContent =
                "Score: " + score;

            if (currentQuestion === questions.length - 1) {

                document.getElementById("next-btn").textContent =
                    "See Results";

            } else {

                document.getElementById("next-btn").textContent =
                    "Next Question";

            }

            document.getElementById("next-btn").style.display = "block";
        }

        function nextQuestion() {

            currentQuestion++;

            if (currentQuestion < questions.length) {

                showQuestion();

            } else {

                showResults();

            }
        }

        function showResults() {

            document.getElementById("question").textContent =
                "Quiz Completed!";

            document.getElementById("answers").innerHTML = "";

            document.getElementById("feedback").textContent =
                "You scored " + score + " out of " +
                questions.length + "!";

            document.getElementById("score").textContent =
                "Final Score: " + score;

            document.getElementById("next-btn").style.display = "none";

            document.getElementById("restart-btn").style.display = "block";
        }

        function restartQuiz() {

            currentQuestion = 0;
            score = 0;

            document.getElementById("restart-btn").style.display = "none";

            showQuestion();
        }

        showQuestion();

    </script>

</body>
</html>
